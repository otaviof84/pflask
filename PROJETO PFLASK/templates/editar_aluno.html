{% include 'cabecalho.html' %}

    <h1 class="mb-4">Editar Aluno: {{ aluno.nome }}</h1>
    
    <form method="POST" action="{{ url_for('editar_aluno', id=aluno.id) }}" class="card p-4 shadow">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" class="form-control" id="nome" name="nome" value="{{ aluno.nome }}" required>
        </div>
        <div class="mb-3">
            <label for="idade" class="form-label">Idade:</label>
            <input type="number" class="form-control" id="idade" name="idade" value="{{ aluno.idade }}" required>
        </div>
        <button type="submit" class="btn btn-primary">Atualizar Aluno</button>
        <a href="{{ url_for('listar_alunos') }}" class="btn btn-secondary mt-2">Cancelar</a>
    </form>
