{% include 'cabecalho.html' %}

    <h1 class="mb-4">🎓 Gerenciamento de Alunos</h1>

    <div class="d-flex justify-content-end mb-3">
        <a href="{{ url_for('adicionar_aluno') }}" class="btn btn-success">
            + Adicionar Novo Aluno
        </a>
    </div>

    <div class="card shadow p-3">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th class="text-center">Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for aluno in alunos %}
                <tr>
                    <td>{{ aluno.id }}</td>
                    <td>{{ aluno.nome }}</td>
                    <td>{{ aluno.idade }}</td>
                    <td class="text-center">
                        <a href="{{ url_for('editar_aluno', id=aluno.id) }}" class="btn btn-sm btn-warning me-2">
                            Editar
                        </a>
                        <a href="{{ url_for('excluir_aluno', id=aluno.id) }}" 
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Tem certeza que deseja excluir o aluno {{ aluno.nome }}?');">
                            Excluir
                        </a>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" class="text-center">Nenhum aluno cadastrado.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

{% include 'rodape.html' %}
