{% include 'cabecalho.html' %} 

<main class="container mt-4">
    <h2>Desafio Obrigatório: Formulário de Cadastro</h2>
    <p>Preencha os dados e envie via POST para a rota de processamento.</p>
    
    <form action="/processa_cadastro" method="POST">
        
        <label for="nome">Nome Completo:</label><br>
        <input type="text" id="nome" name="nome" required><br><br>
        
        <label for="data_nascimento">Data de Nascimento:</label><br>
        <input type="date" id="data_nascimento" name="data_nascimento" required><br><br>
        
        <label for="cpf">CPF:</label><br>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required><br><br>
        
        <label for="nome_mae">Nome da Mãe:</label><br>
        <input type="text" id="nome_mae" name="nome_mae" required><br><br>
        
        <button type="submit" class="btn btn-primary">Enviar Cadastro</button>
    </form>
</main>
