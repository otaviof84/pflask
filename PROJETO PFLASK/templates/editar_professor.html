{% include 'cabecalho.html' %}

    <h1 class="mb-4">Editar Professor: {{ professor.nome }}</h1>
    
    <form method="POST" action="{{ url_for('editar_professor', id=professor.id) }}" class="card p-4 shadow">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" class="form-control" id="nome" name="nome" value="{{ professor.nome }}" required>
        </div>
        <div class="mb-3">
            <label for="disciplina" class="form-label">Disciplina:</label>
            <input type="text" class="form-control" id="disciplina" name="disciplina" value="{{ professor.disciplina }}" required>
        </div>
        <button type="submit" class="btn btn-primary">Atualizar Professor</button>
        <a href="{{ url_for('listar_professores') }}" class="btn btn-secondary mt-2">Cancelar</a>
    </form>
